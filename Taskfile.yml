version: '3'

tasks:
  default:
    desc: List available commands
    cmds:
      - task --list

  run:
    desc: Start the game (accepts arguments after --)
    interactive: true
    cmds:
      - go run ./cmd/chess-tui {{.CLI_ARGS}}

  ai:
    desc: Play against the AI on medium difficulty (accepts arguments after --)
    interactive: true
    cmds:
      - go run ./cmd/chess-tui -ai medium {{.CLI_ARGS}}

  test:
    desc: Run all tests without reusing cached results
    cmds:
      - go test ./... -count=1 -timeout 60s {{.CLI_ARGS}}

  vet:
    desc: Analyze code with go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go files
    cmds:
      - go fmt ./...

  build:
    desc: Build the executable in bin/
    cmds:
      - go build -o ./bin/ ./cmd/chess-tui

  check:
    desc: Run tests, static analysis, and build
    cmds:
      - task: test
      - task: vet
      - task: build
